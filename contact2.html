<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Ananya Hegde through the accessible portfolio contact form.">

    <meta name="author"
          content="Ananya Hegde">

    <meta name="robots"
          content="index, follow">

    <title>Contact | Ananya Hegde</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<a class="skip-link"
   href="#main-content">
    Skip to main content
</a>


<header class="site-header">

    <nav class="navbar"
         aria-label="Primary navigation">

        <a href="index.html"
           class="logo">
            ByteForge
        </a>

        <button class="menu-button"
                type="button"
                aria-expanded="false"
                aria-controls="primary-menu"
                aria-label="Open navigation menu">
            ☰
        </button>

        <ul id="primary-menu"
            class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

            <li>
                <a href="projects.html">
                    Projects
                </a>
            </li>

            <li>
                <a href="contact.html"
                   aria-current="page">
                    Contact
                </a>
            </li>

        </ul>

    </nav>

</header>


<main id="main-content">

    <section class="page-header"
             aria-labelledby="page-title">

        <div class="container">

            <h1 id="page-title">
                Contact Me
            </h1>

            <p>
                Have a question or want to get in touch?
            </p>

        </div>

    </section>


    <section class="section"
             aria-labelledby="contact-form-title">

        <div class="container narrow">

            <h2 id="contact-form-title">
                Send a Message
            </h2>

            <form id="contact-form"
                  action="#"
                  method="post"
                  novalidate
                  aria-describedby="form-description">

                <p id="form-description">
                    All fields marked with
                    <span aria-hidden="true">*</span>
                    are required.
                </p>


                <div class="form-group">

                    <label for="name">
                        Name
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true"
                        aria-describedby="name-error">

                    <span id="name-error"
                          class="error-message"
                          role="alert">
                    </span>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true"
                        aria-describedby="email-error">

                    <span id="email-error"
                          class="error-message"
                          role="alert">
                    </span>

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                        aria-required="true"
                        aria-describedby="subject-error">

                    <span id="subject-error"
                          class="error-message"
                          role="alert">
                    </span>

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                        <span aria-hidden="true">*</span>
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        aria-required="true"
                        aria-describedby="message-error"></textarea>

                    <span id="message-error"
                          class="error-message"
                          role="alert">
                    </span>

                </div>


                <button class="button"
                        type="submit">
                    Send Message
                </button>


                <p id="form-status"
                   role="status"
                   aria-live="polite">
                </p>

            </form>

        </div>

    </section>

</main>

    <div class="container">

        <p>

        </p>

        <nav aria-label="Footer navigation">

            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>

        </nav>

    </div>

</footer>

</body>
</html>
